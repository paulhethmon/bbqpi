plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hethmon'
version = '0.0.1-SNAPSHOT'
description = 'Smoker/BBQ temperature control using a Raspberry Pi'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

plugins.withType(JavaPlugin).configureEach {
	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(25)
		}
		modularity.inferModulePath = true
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {

	implementation 'org.slf4j:slf4j-api:2.0.16'
	implementation 'org.slf4j:slf4j-simple:2.0.16'
	implementation 'com.pi4j:pi4j-core:4.0.0'
	implementation 'com.pi4j:pi4j-plugin-ffm:4.0.0'

    // The BOM will manage the module versions and transitive dependencies
    implementation platform('com.google.auth:google-auth-library-bom:1.30.1')
    // Replace with the module(s) that are needed
    implementation 'com.google.auth:google-auth-library-oauth2-http'
    implementation 'com.google.apis:google-api-services-gmail:v1-rev20240520-2.0.0'
    implementation 'javax.mail:mail:1.4.7'

	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
//	implementation 'org.liquibase:liquibase-core'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
